apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openproject
  namespace: openproject
spec:
  interval: 30m0s
  timeout: 15m0s
  chart:
    spec:
      chart: openproject
      sourceRef:
        kind: HelmRepository
        name: openproject
        namespace: flux-system
  values:
    image:
      tag: "17"
    openproject:
      https: true
      host: openproject.cloud.clearclean.local
      seed_locale: de
    containerSecurityContext:
      enabled: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      seccompProfile:
        type: "RuntimeDefault"
      readOnlyRootFilesystem: false
      runAsNonRoot: true
    ingress:
      enabled: true
      ingressClassName: traefik
      host: openproject.cloud.clearclean.local
      annotations:
        cert-manager.io/cluster-issuer: clearclean-ca
      tls:
        enabled: true
        secretName: openproject-tls
    persistence:
      enabled: true
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
    postgresql:
      primary:
        persistence:
          storageClass: local-path
