apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plane
  namespace: plane
spec:
  interval: 30m0s
  timeout: 10m0s
  chart:
    spec:
      chart: plane-ce
      sourceRef:
        kind: HelmRepository
        name: makeplane
        namespace: flux-system
  values:
    planeVersion: stable
    ingress:
      appHost: plane.cloud.clearclean.local
      ingressClass: traefik
      tls:
        secretName: plane-tls
    env:
      storageClass: local-path
