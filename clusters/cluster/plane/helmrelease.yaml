apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plane
  namespace: plane
spec:
  interval: 30m0s
  timeout: 10m0s
  chart:
    spec:
      chart: plane-ce
      sourceRef:
        kind: HelmRepository
        name: makeplane
        namespace: flux-system
  values:
    planeVersion: stable
    ingress:
      appHost: plane.cloud.clearclean.local
      ingressClass: traefik
    env:
      storageClass: local-path
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Ingress
          name: plane-ingress
        patch: |
          - op: add
            path: /metadata/annotations/cert-manager.io~1cluster-issuer
            value: clearclean-ca
          - op: add
            path: /spec/tls
            value:
            - hosts:
              - plane.cloud.clearclean.local
              secretName: plane-tls
