apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: espocrm
  namespace: espocrm
spec:
  interval: 30m0s
  chart:
    spec:
      chart: mariadb
      version: 4.4.5
      sourceRef:
        kind: HelmRepository
        name: groundhog2k
        namespace: flux-system
  values:
    image:
      registry: "docker.io"
      repository: "mariadb"
      pullPolicy: IfNotPresent

    serviceAccount:
      create: false

    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999

    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsGroup: 999
      runAsUser: 999
      capabilities:
        drop:
          - ALL

    service:
      type: ClusterIP
      port: 3306

    settings:
      rootPassword:
        value: root_password
      allowEmptyRootPassword: false
      skipTZInfo: false

    userDatabase:
      name:
        value: espocrm
      user:
        value: espocrm
      password:
        value: password

    storage:
      accessModes:
        - ReadWriteOnce
