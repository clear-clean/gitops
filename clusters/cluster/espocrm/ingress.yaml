apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: espocrm
  namespace: espocrm
spec:
  rules:
  - host: espocrm.cloud.clearclean.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: espocrm
            port:
              number: 80
