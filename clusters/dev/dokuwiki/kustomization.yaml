apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dokuwiki
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
# Die ConfigMaps bekommen einen Hash im Namen. Aendert sich eine der Dateien,
# aendert sich der Name, und das Deployment startet den Pod neu.
configMapGenerator:
  - name: dokuwiki-config
    files:
      - config/local.protected.php
      - config/plugins.protected.php
  - name: dokuwiki-init
    files:
      - init/init-storage.sh
      - init/plugins.txt
      - init/acl.auth.php
      - init/users.auth.php.head
