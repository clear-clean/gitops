# HTTPS: liefert das Wiki aus. TLS terminiert am Gateway (Wildcard-Zertifikat).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dokuwiki
  namespace: dokuwiki
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - dokuwiki.dev.cloud.clearclean.local
  rules:
  - backendRefs:
    - name: dokuwiki
      port: 80
---
# HTTP: leitet dauerhaft auf HTTPS um.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dokuwiki-https-redirect
  namespace: dokuwiki
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: web
  hostnames:
  - dokuwiki.dev.cloud.clearclean.local
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
