# Haengt sich an beide Listener (HTTP und HTTPS) des Wildcard-Gateways.
# TLS terminiert am Gateway, hier ist kein Zertifikat noetig.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dokuwiki
  namespace: dokuwiki
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - dokuwiki.dev.cloud.clearclean.local
  rules:
  - backendRefs:
    - name: dokuwiki
      port: 80
