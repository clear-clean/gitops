# Offizielles DokuWiki-Image (https://hub.docker.com/r/dokuwiki/dokuwiki),
# kein Bitnami. Alle veraenderlichen Daten (Seiten, Medien, conf, Plugins,
# Templates) liegen im Volume unter /storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dokuwiki
  namespace: dokuwiki
  labels:
    app.kubernetes.io/name: dokuwiki
spec:
  replicas: 1
  # RWO-Volume auf einem Node: alten Pod erst beenden, dann neuen starten.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dokuwiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dokuwiki
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: dokuwiki
        image: dokuwiki/dokuwiki:2026-07-14c
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PHP_TIMEZONE
          value: Europe/Berlin
        volumeMounts:
        - name: storage
          mountPath: /storage
        readinessProbe:
          httpGet:
            path: /health.php
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health.php
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: dokuwiki
