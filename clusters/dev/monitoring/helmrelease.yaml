# Metriken: Prometheus Operator, Prometheus, Alertmanager, node-exporter,
# kube-state-metrics und Grafana. Loki und Tempo folgen in eigenen Releases.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m0s
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "94.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: kube-prometheus-stack-values
    valuesKey: kube-state-metrics-flux.yaml
  values:
    # Kubespray bindet etcd, Scheduler, Controller-Manager und kube-proxy an
    # 127.0.0.1; ohne Anpassung im Inventory waeren diese Ziele dauerhaft "down".
    kubeEtcd: {enabled: false}
    kubeScheduler: {enabled: false}
    kubeControllerManager: {enabled: false}
    kubeProxy: {enabled: false}

    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 40GB
        # Tempo schreibt Service-Graph- und Span-Metriken per Remote Write
        # (nur cluster-intern, Prometheus ist nicht von aussen erreichbar).
        enableRemoteWriteReceiver: true
        # alle ServiceMonitor/PodMonitor/Rules im Cluster einsammeln,
        # nicht nur die mit dem Label dieses Releases
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        resources:
          requests: {cpu: 200m, memory: 1Gi}
          limits: {memory: 2Gi}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests: {storage: 50Gi}

    alertmanager:
      alertmanagerSpec:
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 128Mi}
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests: {storage: 1Gi}

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      grafana.ini:
        server:
          domain: grafana.dev.cloud.clearclean.local
          root_url: https://grafana.dev.cloud.clearclean.local/
        users:
          allow_sign_up: false
        analytics:
          reporting_enabled: false
          check_for_updates: false
      # Datenquellen und Dashboards kommen aus Git (Sidecar), Grafana selbst
      # braucht deshalb kein Volume.
      persistence:
        enabled: false
      # Loki fuer Logs (clusters/dev/logging); die Prometheus-Datenquelle
      # legt das Chart selbst an.
      additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
          # Grafana soll keine Regeln in Loki verwalten. Loki speichert Regeln
          # hier nur lokal und beantwortet die Ruler-Abfragen mit 400.
          # Log-Alarme gehen weiterhin als Grafana-Alarme.
          manageAlerts: false
      # Tempo fuer Traces (clusters/dev/tracing), verknuepft mit Loki und
      # Prometheus
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          # vom Trace zu den Logs desselben Pods, +/- 5 Minuten
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: false
            tags:
            - key: k8s.namespace.name
              value: k8s_namespace_name
            - key: k8s.pod.name
              value: k8s_pod_name
          # Service-Graph aus den Metriken des Tempo-Generators
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          search:
            hide: false
      # Helm-Test-Pod, laeuft nur bei "helm test"
      testFramework:
        enabled: false
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {memory: 512Mi}
