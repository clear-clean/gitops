# HTTPS: Grafana. TLS terminiert am Gateway (Wildcard-Zertifikat).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - grafana.dev.cloud.clearclean.local
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-grafana
      port: 80
---
# HTTP: leitet dauerhaft auf HTTPS um.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-https-redirect
  namespace: monitoring
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: web
  hostnames:
  - grafana.dev.cloud.clearclean.local
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
