apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 30m0s
  chartRef:
    kind: OCIRepository
    name: gitea
    namespace: flux-system
  # Gitea startet erst, wenn die Datenbank da ist (Secret gitea-db-app).
  # Beim ersten Ausrollen kann das einen Anlauf laenger dauern.
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # RWO-Volume auf einem Node: alten Pod erst beenden, dann neuen starten.
    strategy:
      type: Recreate

    # Die Datenbank kommt von CloudNativePG (database.yaml). Die im Chart
    # eingebauten Bitnami-Subcharts bleiben aus.
    postgresql-ha:
      enabled: false
    postgresql:
      enabled: false
    valkey-cluster:
      enabled: false
    valkey:
      enabled: false

    persistence:
      enabled: true
      size: 10Gi
      storageClass: local-path

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    # Helm-Test-Hook (busybox:latest) nicht anlegen
    test:
      enabled: false

    gitea:
      admin:
        # Benutzername und Passwort aus admin-secret.sops.yaml.
        existingSecret: gitea-admin
        email: gitea-admin@clearclean.local
        # Das Secret im Repo ist die Wahrheit: eine Aenderung des Passworts in
        # der Oberflaeche wird beim naechsten Start zurueckgesetzt.
        passwordMode: keepUpdated

      # /metrics einschalten. Das Token steht nicht in den Values (Klartext
      # im Repo), sondern kommt per Env aus metrics-secret.sops.yaml; den
      # PodMonitor dazu gibt es in clusters/dev/monitoring-config.
      metrics:
        enabled: true

      config:
        server:
          DOMAIN: gitea.dev.cloud.clearclean.local
          ROOT_URL: https://gitea.dev.cloud.clearclean.local/
          # SSH ist nur innerhalb des Clusters erreichbar (Service gitea-ssh),
          # es gibt keine Freigabe nach aussen. Genutzt wird es vom Otter Wiki,
          # das sein Repository per SSH mit Gitea abgleicht. Menschen und
          # Agenten greifen von aussen ueber HTTPS zu. Die in der Oberflaeche
          # angezeigte SSH-Adresse ist deshalb die cluster-interne.
          SSH_DOMAIN: gitea-ssh.gitea.svc.cluster.local
          # Der Service gitea-ssh ist headless: sein Name zeigt direkt auf den
          # Pod, und dort lauscht Gitea auf 2222. Damit zeigt die Oberflaeche
          # die Adresse mit dem richtigen Port.
          SSH_PORT: 2222
          # Ausdruecklich false: app.ini liegt im Volume, und das Chart
          # entfernt dort keine Werte. Eine geloeschte Zeile behielte den
          # alten Wert (true).
          DISABLE_SSH: false
        database:
          DB_TYPE: postgres
          HOST: gitea-db-rw.gitea.svc.cluster.local:5432
        service:
          # Konten legt nur ein Administrator an
          DISABLE_REGISTRATION: true
        webhook:
          # Gitea ruft Webhooks an interne Adressen standardmaessig nicht auf.
          # Freigegeben ist genau der Service des Otter Wikis, das nach einem
          # Merge den neuen Stand abholt.
          ALLOWED_HOST_LIST: otterwiki.otterwiki.svc.cluster.local
        # Ohne Valkey/Redis: Einstellungen fuer den Betrieb mit einem Pod
        session:
          PROVIDER: db
        cache:
          ADAPTER: memory
        queue:
          TYPE: level
        indexer:
          ISSUE_INDEXER_TYPE: bleve
          REPO_INDEXER_ENABLED: false

      # Name, Benutzer und Passwort der Datenbank aus dem vom Operator
      # erzeugten Secret
      additionalConfigFromEnvs:
        - name: GITEA__DATABASE__NAME
          valueFrom:
            secretKeyRef:
              name: gitea-db-app
              key: dbname
        - name: GITEA__DATABASE__USER
          valueFrom:
            secretKeyRef:
              name: gitea-db-app
              key: username
        - name: GITEA__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-db-app
              key: password
        - name: GITEA__METRICS__TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-metrics
              key: token

    # HTTPS ueber das Wildcard-Gateway; TLS terminiert dort.
    gatewayAPI:
      enabled: true
      core:
        httpRoute:
          enabled: true
          tls: true
          parentRefs:
            - name: traefik-gateway
              namespace: traefik
              sectionName: websecure
          hostnames:
            - gitea.dev.cloud.clearclean.local
