# HTTP leitet dauerhaft auf HTTPS um. Die HTTPS-Route legt das Helm-Chart an.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-https-redirect
  namespace: gitea
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: web
  hostnames:
  - gitea.dev.cloud.clearclean.local
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
