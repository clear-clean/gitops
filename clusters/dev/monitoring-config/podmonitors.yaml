# Scrape-Ziele der Apps auf dev. Sie liegen hier und nicht bei den Apps,
# weil die Monitoring-CRDs erst mit clusters/dev/monitoring entstehen und
# Traefik und cert-manager vorher laufen muessen (sonst Abhaengigkeitskreis).
#
# Flux-Controller (Vorlage: fluxcd/flux2-monitoring-example)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  namespace: flux-system
spec:
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - helm-controller
      - source-controller
      - kustomize-controller
      - notification-controller
  podMetricsEndpoints:
  - port: http-prom
---
# Traefik: Metriken auf dem Entrypoint "metrics" (Chart-Standard, Port 9100)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
  namespace: traefik
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  podMetricsEndpoints:
  - port: metrics
---
# cert-manager: Controller, CA-Injector und Webhook
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  podMetricsEndpoints:
  - port: http-metrics
---
# CloudNativePG-Operator
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-operator
  namespace: cnpg-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  podMetricsEndpoints:
  - port: metrics
---
# PostgreSQL von Gitea (Exporter in der CNPG-Instanz)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gitea-db
  namespace: gitea
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: gitea-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
  - port: metrics
---
# Gitea: /metrics ist ueber die HTTPRoute auch von aussen erreichbar und
# deshalb mit einem Token geschuetzt (Secret gitea-metrics, gitea/metrics-secret.sops.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gitea
  namespace: gitea
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
      app.kubernetes.io/instance: gitea
  podMetricsEndpoints:
  - port: http
    path: /metrics
    authorization:
      type: Bearer
      credentials:
        name: gitea-metrics
        key: token
