# CloudNativePG-Operator: verwaltet PostgreSQL-Cluster (Kind "Cluster",
# postgresql.cnpg.io/v1) fuer die Apps auf dev. Die Datenbanken selbst
# liegen bei der jeweiligen App, z. B. clusters/dev/gitea/database.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-operator
  namespace: cnpg-system
spec:
  interval: 30m0s
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.x"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  # Der Operator bringt seine CRDs im Chart mit; bei Upgrades mit aktualisieren.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    monitoring:
      # Dashboard fuer PostgreSQL-Cluster als ConfigMap fuer den Grafana-Sidecar.
      # Die Scrape-Ziele liegen in clusters/dev/monitoring-config.
      grafanaDashboard:
        # Das Label grafana_dashboard=1 setzt das Chart selbst (sidecarLabel);
        # ein zusaetzliches labels.grafana_dashboard ergibt einen doppelten Key.
        create: true
