# HTTPS: liefert das Wiki aus, auch den Git-Zugang unter /.git.
# TLS terminiert am Gateway (Wildcard-Zertifikat).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otterwiki
  namespace: otterwiki
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - otterwiki.dev.cloud.clearclean.local
  rules:
  - backendRefs:
    - name: otterwiki
      port: 80
---
# HTTP: leitet dauerhaft auf HTTPS um.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otterwiki-https-redirect
  namespace: otterwiki
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: web
  hostnames:
  - otterwiki.dev.cloud.clearclean.local
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
