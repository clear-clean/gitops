# An Otter Wiki (https://otterwiki.com), offizielles Image in der
# unprivilegierten slim-Variante (kein nginx, laeuft als www-data, Port 8080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otterwiki
  namespace: otterwiki
  labels:
    app.kubernetes.io/name: otterwiki
spec:
  # Otter Wiki kennt kein Locking: nie mehr als eine Instanz.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otterwiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otterwiki
    spec:
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        runAsNonRoot: true
      initContainers:
      # Setzt die Git-Einstellungen fuer den Abgleich und legt den Admin an,
      # falls er fehlt (init/init.sh). Der Entrypoint des Images bleibt aktiv
      # und bereitet vorher Repository und settings.cfg im Volume vor.
      - name: init
        image: redimp/otterwiki:2.27.0-slim
        args: ["sh", "/gitops/init.sh"]
        envFrom:
        - configMapRef:
            name: otterwiki-config
        - secretRef:
            name: otterwiki-users
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: otterwiki-sync
              key: SECRET_KEY
        volumeMounts:
        - name: data
          mountPath: /app-data
        - name: init
          mountPath: /gitops
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      containers:
      - name: otterwiki
        image: redimp/otterwiki:2.27.0-slim
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: otterwiki-config
        env:
        # Fest vorgegeben statt vom Image erzeugt: aus SECRET_KEY und der
        # Adresse des Remotes berechnet das Wiki die geheime Webhook-Adresse,
        # die in Gitea hinterlegt ist. Sie muss einen Volume-Reset ueberstehen.
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: otterwiki-sync
              key: SECRET_KEY
        volumeMounts:
        - name: data
          mountPath: /app-data
        # SSH-Schluessel fuer den Abgleich mit Gitea (dort als Deploy-Key)
        - name: sync
          mountPath: /sync
          readOnly: true
        readinessProbe:
          httpGet:
            path: /-/healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: otterwiki
      - name: init
        configMap:
          name: otterwiki-init
      - name: sync
        secret:
          secretName: otterwiki-sync
          defaultMode: 0440
          items:
          - key: id_ed25519
            path: id_ed25519
