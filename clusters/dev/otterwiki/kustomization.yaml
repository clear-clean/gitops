apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otterwiki
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - users-secret.sops.yaml
  - sync-secret.sops.yaml
# Die ConfigMaps bekommen einen Hash im Namen. Aendert sich eine der Dateien,
# startet das Deployment den Pod neu.
configMapGenerator:
  # Einstellungen des Wikis, siehe https://otterwiki.com/Configuration
  - name: otterwiki-config
    envs:
      - config.env
  - name: otterwiki-init
    files:
      - init/init.sh
