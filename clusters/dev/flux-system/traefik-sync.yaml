apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  dependsOn:
  - name: gateway-api
  - name: cert-manager-config
  interval: 10m0s
  path: ./clusters/dev/traefik
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
