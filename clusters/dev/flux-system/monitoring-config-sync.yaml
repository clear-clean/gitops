apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-config
  namespace: flux-system
spec:
  # braucht die CRDs PodMonitor/ServiceMonitor aus kube-prometheus-stack
  dependsOn:
  - name: monitoring
  interval: 10m0s
  path: ./clusters/dev/monitoring-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
