apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/dev/cert-manager
  prune: true
  # erst Ready, wenn das HelmRelease installiert ist (CRDs vorhanden)
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
