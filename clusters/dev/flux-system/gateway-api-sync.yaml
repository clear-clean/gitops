# Gateway-API-CRDs (Standard-Channel) direkt aus dem Upstream-Repo.
# Traefik 3.8 verlangt v1.7.0 oder neuer; Kubespray v2.31.0 liefert maximal
# v1.5.1, deshalb ist gateway_api_enabled im Kubespray-Inventory abgeschaltet
# und die CRDs werden hier verwaltet. Upgrade: tag anheben.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h0m0s
  ref:
    tag: v1.7.0
  url: https://github.com/kubernetes-sigs/gateway-api
  ignore: |
    # nur die CRD-Definitionen ins Artefakt aufnehmen
    /*
    !/config/crd
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./config/crd
  # CRDs nie automatisch loeschen: das wuerde alle Gateways und Routen entfernen.
  prune: false
  sourceRef:
    kind: GitRepository
    name: gateway-api
