apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
  - name: traefik
  interval: 10m0s
  path: ./clusters/dev/monitoring
  prune: true
  # erst Ready, wenn das HelmRelease installiert ist (Monitoring-CRDs vorhanden)
  wait: true
  timeout: 10m0s
  # *.sops.yaml mit dem age-Schluessel aus flux-system/sops-age entschluesseln
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
