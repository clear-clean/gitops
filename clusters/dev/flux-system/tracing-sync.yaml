apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tracing
  namespace: flux-system
spec:
  # Namespace monitoring und ServiceMonitor-CRD kommen aus kube-prometheus-stack
  dependsOn:
  - name: monitoring
  interval: 10m0s
  path: ./clusters/dev/tracing
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
