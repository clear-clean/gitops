apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otterwiki
  namespace: flux-system
spec:
  dependsOn:
  - name: traefik
  interval: 10m0s
  path: ./clusters/dev/otterwiki
  prune: true
  # *.sops.yaml mit dem age-Schluessel aus flux-system/sops-age entschluesseln
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
