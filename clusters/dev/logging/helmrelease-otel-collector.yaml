# OpenTelemetry Collector als DaemonSet: liest die Container-Logs des Nodes
# (/var/log/pods), ergaenzt Kubernetes-Metadaten und schickt sie per OTLP
# an Loki. Spaeter nimmt er auch Traces an (Schritt 4).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  interval: 30m0s
  dependsOn:
  - name: loki
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.183.x"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: daemonset
    image:
      # Distribution mit den Komponenten fuer Kubernetes
      repository: otel/opentelemetry-collector-k8s

    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
        # Leseposition auf dem Node merken, damit nach einem Neustart
        # nichts doppelt oder verloren geht
        storeCheckpoints: true
      kubernetesAttributes:
        enabled: true

    # Die Logdateien unter /var/log/pods gehoeren root (0640).
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]

    # Eigene Metriken des Collectors (Port 8888) in Prometheus
    ports:
      metrics:
        enabled: true
    podMonitor:
      enabled: true

    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}

    config:
      exporters:
        otlp_http/loki:
          endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
      receivers:
        # nur, was gebraucht wird; OTLP bleibt fuer Schritt 4
        jaeger: null
        zipkin: null
        prometheus: null
      service:
        pipelines:
          logs:
            exporters: [otlp_http/loki]
          metrics: null
          traces: null
