# OpenTelemetry Collector als DaemonSet: liest die Container-Logs des Nodes
# (/var/log/pods), ergaenzt Kubernetes-Metadaten und schickt sie per OTLP
# an Loki. Ausserdem nimmt er Traces per OTLP an (z. B. von Traefik) und
# reicht sie an Tempo weiter (clusters/dev/tracing).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  interval: 30m0s
  dependsOn:
  - name: loki
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.183.x"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: daemonset
    image:
      # Distribution mit den Komponenten fuer Kubernetes
      repository: otel/opentelemetry-collector-k8s

    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
        # Leseposition auf dem Node merken, damit nach einem Neustart
        # nichts doppelt oder verloren geht
        storeCheckpoints: true
      kubernetesAttributes:
        enabled: true

    # Die Logdateien unter /var/log/pods gehoeren root (0640).
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]

    # OTLP nur cluster-intern ueber den Service, keine Host-Ports: sonst
    # koennte jeder im LAN ueber 192.168.1.92:4317/4318 Daten einspielen.
    # Jaeger und Zipkin werden nicht gebraucht.
    ports:
      otlp:
        hostPort: 0
      otlp-http:
        hostPort: 0
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
      # Eigene Metriken des Collectors (Port 8888) in Prometheus
      metrics:
        enabled: true
    # Im DaemonSet-Modus nur auf Wunsch; internalTrafficPolicy Local,
    # d. h. jeder Pod spricht mit dem Collector auf seinem eigenen Node.
    service:
      enabled: true
    podMonitor:
      enabled: true

    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}

    config:
      exporters:
        otlp_http/loki:
          endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
        otlp_http/tempo:
          endpoint: http://tempo.monitoring.svc.cluster.local:4318
      receivers:
        # nur, was gebraucht wird: file_log (Preset) und OTLP
        jaeger: null
        zipkin: null
        prometheus: null
      service:
        pipelines:
          logs:
            exporters: [otlp_http/loki]
          metrics: null
          traces:
            receivers: [otlp]
            processors: [memory_limiter, k8s_attributes, batch]
            exporters: [otlp_http/tempo]
