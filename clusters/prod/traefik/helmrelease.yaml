apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m0s
  chart:
    spec:
      chart: traefik
      version: "43.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    ingressRoute:
      dashboard:
        enabled: true
    service:
      spec:
        type: ClusterIP
    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443
    # Host-Ports 80/443 auf einem Single-Node-Cluster: der neue Pod kann erst
    # starten, wenn der alte die Ports freigegeben hat. Mit dem Chart-Default
    # (maxSurge 1 / maxUnavailable 0) bleibt jedes Upgrade haengen.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
